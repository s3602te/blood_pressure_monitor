<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f2f6f5">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <title>管理｜血壓記錄</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <div class="login-hero">
      <h1 class="page-title">管理：重設密碼</h1>
      <p class="page-sub">幫忘記密碼的家人換一個新密碼。</p>
    </div>

    <form id="unlockForm">
      <div class="field">
        <label for="adminCode">管理密碼</label>
        <input class="input" id="adminCode" type="password" autocomplete="off" required>
      </div>
      <button class="btn btn-primary" id="unlockBtn" type="submit">進入</button>
    </form>

    <form id="resetForm" hidden>
      <div class="field">
        <label for="account">要重設誰的密碼</label>
        <select class="input" id="account" required></select>
      </div>
      <div class="field">
        <label for="newPassword">新密碼 <span class="field-hint">（至少 4 個字元）</span></label>
        <input class="input" id="newPassword" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" minlength="4" maxlength="64" required>
      </div>
      <button class="btn btn-primary" id="resetBtn" type="submit">重設密碼</button>
    </form>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="fine-print">重設後，對方在所有裝置上都會被登出，要用新密碼重新登入。紀錄不會消失。</p>
  </main>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
