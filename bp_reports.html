<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f2f6f5">
  <link rel="manifest" href="icons/site.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="shortcut icon" href="icons/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <title>歷史紀錄｜血壓記錄</title>
  <link rel="stylesheet" href="style.css?v=6">
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="has-nav">
  <header class="topbar">
    <div class="wrap topbar-in">
      <span class="brand">血壓記錄</span>
      <div class="who">
        <span id="userName"></span>
        <button type="button" class="link-btn" id="fontBtn">放大字</button>
        <button type="button" class="link-btn" id="logoutBtn">登出</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <h1 class="page-title">歷史紀錄</h1>
    <p class="page-sub" id="loadingText">讀取中…</p>
    <p class="status error" id="errorText" role="alert"></p>

    <div class="empty" id="emptyState" hidden>
      <p><strong>還沒有任何紀錄</strong></p>
      <p>量完血壓後，到「記錄血壓」存下第一筆。</p>
      <a class="btn btn-primary" href="index.html">去記錄血壓</a>
    </div>

    <div id="content" hidden>
      <section class="readout" aria-live="polite">
        <p class="readout-caption" id="summaryCaption"></p>
        <p class="readout-num"><span id="avgSys">--</span><span class="slash">/</span><span id="avgDia">--</span></p>
        <p class="readout-unit">平均血壓（收縮 / 舒張，mmHg）　平均脈搏 <span id="avgPulse">--</span> 次／分鐘</p>
      </section>

      <section class="card" aria-label="血壓走勢圖">
        <div class="chart-box"><canvas id="bpChart"></canvas></div>
        <ul class="legend-list">
          <li>虛線是參考線：135（收縮壓）、85（舒張壓）。</li>
          <li>橘色大圓點表示高於參考值。</li>
          <li>點一下圖上的某一天，可以看到脈搏和吃藥狀況。</li>
        </ul>
      </section>

      <section class="card" aria-label="每日數值">
        <table class="log">
          <caption id="rangeCaption"></caption>
          <thead>
            <tr>
              <th scope="col">日期</th>
              <th scope="col" class="num">收縮</th>
              <th scope="col" class="num">舒張</th>
              <th scope="col" class="num">脈搏</th>
              <th scope="col">吃藥</th>
            </tr>
          </thead>
          <tbody id="logBody"></tbody>
        </table>
        <p class="legend-note">黃底數字高於家庭血壓參考值 135 / 85 mmHg，僅供參考，請依醫師指示判斷。</p>
        <p class="legend-note">填錯了？按日期下面的「修改」，可以改數字或刪除那一筆。</p>
      </section>

      <div class="pager">
        <button type="button" class="btn btn-quiet" id="olderPage">較早</button>
        <select class="input" id="pageSelect" aria-label="選擇頁數"></select>
        <button type="button" class="btn btn-quiet" id="newerPage">較新</button>
      </div>
    </div>
    <p class="app-ver" id="appVer"></p>
  </main>

  <div class="modal" id="dayDialog" role="dialog" aria-modal="true" aria-labelledby="dayTitle" hidden>
    <div class="modal-card wide">
      <h2 id="dayTitle"></h2>
      <p id="daySub"></p>
      <div id="dayBody"></div>
      <p class="status error" id="dayError" role="alert"></p>
      <button type="button" class="btn btn-quiet" id="dayClose">關閉</button>
    </div>
  </div>

  <nav class="nav-bottom" aria-label="主要頁面">
    <a href="index.html">記錄血壓</a>
    <a href="bp_reports.html" aria-current="page">歷史紀錄</a>
    <a href="doctor.html">給醫師看</a>
  </nav>

  <script defer src="config.js?v=6"></script>
  <script defer src="auth.js?v=6"></script>
  <script defer src="bp_report.js?v=6"></script>
</body>
</html>
